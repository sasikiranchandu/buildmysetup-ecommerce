<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - BuildMySetup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .btn-main {
            background: #00f2fe;
            color: black;
            font-weight: bold;
        }

        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="login-card text-center">

    <h3 class="mb-4">🔐 Login</h3>

    <form th:action="@{/login}" method="post">

        <input type="text" name="email" class="form-control mb-3" placeholder="Enter Email" required />

        <input type="password" name="password" class="form-control mb-3" placeholder="Enter Password" required />

        <button type="submit" class="btn btn-main w-100">Login</button>

    </form>

    <!-- ❌ Error -->
    <div th:if="${param.error}" class="text-danger mt-3">
        Invalid credentials
    </div>

    <!-- ✅ Logout -->
    <div th:if="${param.logout}" class="text-success mt-3">
        Logged out successfully
    </div>

    <p class="mt-3">
        Don't have an account?
        <a href="/register" class="text-info">Sign Up</a>
    </p>

</div>

</body>
</html>
