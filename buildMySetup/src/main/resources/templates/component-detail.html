<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Component Details</title>

<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
	rel="stylesheet">

<style>
body {
	background: #0f172a;
	color: white;
}

.container-box {
	margin-top: 50px;
}

.component-img {
	width: 100%;
	border-radius: 15px;
	transition: transform 0.3s;
	cursor: zoom-in;
}

.component-img:hover {
	transform: scale(1.15);
}

.card {
	background: #1e293b;
	border-radius: 15px;
	padding: 20px;
}

.btn-cart {
	background: #00f2fe;
	color: black;
	font-weight: bold;
}

.btn-buy {
	background: orange;
	color: black;
	font-weight: bold;
}

.rating {
	color: gold;
	font-size: 20px;
}

.popup {
	position: fixed;
	top: 20px;
	right: 20px;
	background: #22c55e;
	padding: 15px;
	border-radius: 10px;
	display: none;
}
</style>
</head>

<body>

	<div class="container container-box">

		<div class="row">

			<!-- 🖼 IMAGE -->
			<div class="col-md-5">
				<img th:src="${component.imageUrl}" class="component-img" />
			</div>

			<!-- 📦 DETAILS -->
			<div class="col-md-7">
				<div class="card">

					<h2 th:text="${component.name}"></h2>

					<!-- ⭐ Rating -->
					<div class="rating">★★★★☆</div>

					<h4 class="mt-3">
						₹ <span th:text="${component.price}"></span>
					</h4>

					<p class="text-muted" th:text="${component.category}"></p>

					<p>
						Stock: <span th:text="${component.stock}"></span>
					</p>

					<!-- 🛒 Add to Cart -->
					<form th:action="@{/user/add-to-cart}" method="post"
						onsubmit="showPopup()">

						<!-- ✅ ADD THIS (VERY IMPORTANT) -->
						<input type="hidden" th:name="${_csrf.parameterName}"
							th:value="${_csrf.token}" /> <input type="hidden"
							name="componentId" th:value="${component.id}" /> <input
							type="hidden" name="quantity" value="1" />

						<button class="btn btn-cart w-100 mb-2">Add to Cart</button>
					</form>

					<!-- ⚡ Buy Now -->
					<form th:action="@{/user/buy-now}" method="post">

						<input type="hidden" th:name="${_csrf.parameterName}"
							th:value="${_csrf.token}" /> <input type="hidden"
							name="componentId" th:value="${component.id}" />

						<button class="btn btn-buy w-100">Buy Now</button>
					</form>

				</div>
			</div>

		</div>

	</div>

	<!-- ✅ Popup -->
	<div id="popup" class="popup">Added to Cart!</div>

	<script>
function showPopup() {
    let popup = document.getElementById("popup");
    popup.style.display = "block";
    setTimeout(() => popup.style.display = "none", 2000);
}
</script>

</body>
</html>
