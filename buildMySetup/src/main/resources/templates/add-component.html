<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Component</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>➕ Add Component</h2>

    <!-- ✅ IMPORTANT: th:object -->
<form th:action="@{/admin/save}" method="post" enctype="multipart/form-data">
    <input type="text" name="name" class="form-control mb-2" placeholder="Name"/>

    <input type="text" name="category" class="form-control mb-2" placeholder="Category"/>

    <input type="number" name="price" class="form-control mb-2" placeholder="Price"/>

    <input type="number" name="stock" class="form-control mb-2" placeholder="Stock"/>

    <input type="file" name="imageFile" class="form-control mb-2"/>

    <button class="btn btn-success">Save</button>

</form>

</div>

</body>
</html>
