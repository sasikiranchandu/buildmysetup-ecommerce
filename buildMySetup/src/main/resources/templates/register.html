<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register - BuildMySetup</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            color: white;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-card {
            background: #1e293b;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .btn-main {
            background: #00f2fe;
            color: black;
            font-weight: bold;
        }

        .form-control {
            background: #0f172a;
            border: 1px solid #334155;
            color: white;
        }

        .form-control::placeholder {
            color: #94a3b8;
        }
    </style>
</head>

<body>

<div class="register-card text-center">

    <h3 class="mb-4">📝 Register</h3>

    <form th:action="@{/register}" method="post">

<input type="text" id="username" name="name" class="form-control mb-3"  placeholder="User Name"onblur="checkUsername()" required />

<p id="msg"></p>       

        <input type="email" name="email" class="form-control mb-3" placeholder="Enter Email" required />

        <input type="password" name="password" class="form-control mb-3" placeholder="Enter Password" required />

        <button type="submit" class="btn btn-main w-100">Register</button>

    </form>

    <!-- ✅ Success Message -->
    <div th:if="${success}" class="text-success mt-3">
        Registered Successfully! Please Login.
    </div>

    <!-- 🔁 Login Redirect -->
    <p class="mt-3">
        Already have an account?
        <a href="/login" class="text-info">Login</a>
    </p>

</div>

</body>
<script>

async function checkUsername() {

    let username = document.getElementById("username").value;

    let response = await fetch("/check-username?name=" + username);

    let result = await response.text();

    let msg = document.getElementById("msg");

    result = result.trim();

    if(result === "EXISTS") {
        msg.innerHTML = "❌ Username already taken";
        msg.style.color = "red";
    } else {
        msg.innerHTML = "✅ Username available";
        msg.style.color = "lightgreen";
    }
}

</script>
</html>
